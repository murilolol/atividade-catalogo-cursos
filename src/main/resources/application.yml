spring:
  application:
    name: catalogocursos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalogocursos_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
